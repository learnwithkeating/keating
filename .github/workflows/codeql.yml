# CodeQL static analysis for both languages in the tree: the FastAPI backend and the
# frontend that talks to it. Findings land in the repository's Security tab.
#
# The weekly run matters as much as the per-PR one: CodeQL's queries are updated
# continuously, so a scheduled scan finds things in code that has not changed since the
# query that catches them shipped.
name: CodeQL

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Mondays, 05:41 UTC. Off the hour on purpose — the top of the hour is when every
    # scheduled workflow on GitHub queues at once.
    - cron: "41 5 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      # Uploading the SARIF results is what needs write access here.
      security-events: write
      contents: read
      # The action reads workflow run status to attach results to the right run.
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # build-mode: none is the correct mode for interpreted languages — there is nothing to
      # compile, so CodeQL builds its database straight from the source rather than by
      # watching a build. This replaces the old autobuild step.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          category: "/language:${{ matrix.language }}"
