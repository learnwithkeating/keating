# Lint and test on every pull request, and on main after merge.
#
# These jobs report; they do not gate. Branch protection is not available on this repository's
# plan, so nothing here can be a required check and a red run is something a human has to read
# before merging. What the runs cover is what they run: Ruff, whose `S` ruleset is
# flake8-bandit, the test suite including the axe-core accessibility scans, and the container
# checks below. Dependabot (.github/dependabot.yml) covers the dependency and action pins.
# There is no code-scanning analysis on this plan.
#
# Third-party actions are pinned to a full commit SHA rather than a tag: a tag is a movable
# pointer the action's owner can repoint at any time, and a compromised maintainer account is
# the way most Actions supply-chain attacks land. The trailing comment records which release
# the SHA is, and Dependabot's github-actions ecosystem (see .github/dependabot.yml) bumps
# both together so the pins do not go stale.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# Read-only by default. No job here writes to the repository, and a workflow that cannot
# write cannot be turned into one that does by anything it builds or runs.
permissions:
  contents: read

# One run per ref. Pushing again to an open PR cancels the run for the commit it replaced.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          python-version: "3.12"

      # --locked fails rather than re-resolving, so CI tests the dependency set the lockfile
      # actually pins — the same guarantee the Dockerfile relies on.
      - name: Install dependencies
        run: uv sync --locked --group dev

      # Ruff's `S` rules are flake8-bandit, so this step is the security lint as well as the
      # style one. --output-format=github turns findings into inline PR annotations.
      - name: Lint
        run: uv run ruff check --output-format=github

  test:
    name: Tests (incl. accessibility)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --locked --group dev

      # The browser download is ~150MB and is keyed on the Playwright version, because that
      # is what decides which browser build is required. Read the version out of the synced
      # environment rather than hardcoding it, so a lockfile bump invalidates the cache.
      - name: Resolve Playwright version
        id: playwright
        run: |
          version="$(uv run python -c 'from importlib.metadata import version; print(version("playwright"))')"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright.outputs.version }}

      # On a cache miss, fetch the browser and its OS packages. On a hit the browser is
      # already on disk but the apt packages are not — those live outside the cached path
      # and have to be installed on every run.
      - name: Install Chromium and its OS dependencies
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: uv run playwright install --with-deps chromium

      - name: Install Chromium OS dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: uv run playwright install-deps chromium

      # The accessibility suite starts the real app on a free port against a throwaway
      # workspace; it needs no API key, and asserts it is not pointed at a real one.
      - name: Run tests
        run: uv run pytest

      # axe writes its raw findings per surface. On a failure they are what says which rule
      # broke on which element, so keep them retrievable instead of only in the log.
      - name: Upload axe reports
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: axe-reports
          path: .a11y-report/
          retention-days: 14
          if-no-files-found: ignore

  container:
    name: Container starts and serves
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # A build alone is not enough: a Dockerfile whose builder and runtime interpreters have
      # drifted still builds cleanly and only fails when the venv is imported. That regression
      # reached main once. This job runs the thing.
      - name: Build image
        run: docker build -t keating:ci .

      # As the README documents running it: the container enters the mount as the user who
      # owns the mount. The uid mismatch that command exists to avoid is not skipped by
      # running the supported way here — it is covered on purpose, by its own step below.
      - name: Start container against an example course
        run: |
          mkdir -p "$RUNNER_TEMP/workspace"
          cp -r examples/why-you-forget "$RUNNER_TEMP/workspace/"
          docker run -d --name keating-ci \
            -p 127.0.0.1:8000:8000 \
            -v "$RUNNER_TEMP/workspace":/workspace \
            --user "$(id -u):$(id -g)" \
            keating:ci

      - name: Wait for it to serve
        run: |
          for i in $(seq 1 30); do
            if curl -fsS -o /dev/null http://127.0.0.1:8000/; then
              echo "serving after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "::error::container did not serve within 30s"
          docker logs keating-ci
          exit 1

      # The routes below need a session, so the account is created the way an operator creates
      # it — the bootstrap subcommand, inside the running container, against the mounted
      # volume. An account store the app cannot write shows up here rather than at startup,
      # which is why this step and not the one above is where a broken volume surfaces.
      - name: Bootstrap an account and sign in
        run: |
          echo 'ci-smoke-test-password' | docker exec -i keating-ci python main.py bootstrap --username ci
          # The account store is read once, at startup.
          docker restart keating-ci
          for i in $(seq 1 30); do
            curl -fsS -o /dev/null http://127.0.0.1:8000/ && break
            sleep 1
          done
          # curl does send a Secure cookie over http://127.0.0.1, so the jar carries the
          # session from here on.
          curl -fsS -c "$RUNNER_TEMP/cookies" -X POST \
            -H 'Content-Type: application/json' \
            -d '{"username":"ci","password":"ci-smoke-test-password"}' \
            http://127.0.0.1:8000/api/login

      - name: Check an unauthenticated request is refused
        run: |
          code="$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/api/courses)"
          if [ "$code" != 401 ]; then
            echo "::error::GET /api/courses without a session returned $code, not 401"
            exit 1
          fi

      # No API key in CI, so grading is untestable here. These two prove the app booted, read
      # the mounted workspace, and parsed a real course package.
      - name: Check it read the mounted workspace
        run: |
          curl -fsS -b "$RUNNER_TEMP/cookies" http://127.0.0.1:8000/api/courses | grep -q 'why-you-forget'
          curl -fsS -b "$RUNNER_TEMP/cookies" 'http://127.0.0.1:8000/api/lessons?course=why-you-forget' | grep -q '"units"'

      # Reads alone let a broken write ship: the Settings page returned 500 in the documented
      # deployment and no job here noticed, because none of them saved anything. These save,
      # replace the container against the same volume, and read the change back.
      #
      # Both run modes, because they enter the same mount as different users and a write that
      # works for one can fail for the other: the README documents
      # --user "$(id -u):$(id -g)", and without it the app runs as the image's own user. Each
      # publishes on its own port so the container above keeps 8000.
      - name: Check a settings save survives, as the host user
        run: scripts/check-container-settings.sh --run-as host --port 8001

      - name: Check a settings save survives, as the image's user
        run: scripts/check-container-settings.sh --run-as image --port 8002

      # The deployment nobody chooses and everybody eventually hits: a volume created by one
      # uid, a container running as another. Nothing the app does can fix it, so what is
      # checked is that it says which path is at fault and what to change — at startup, from
      # the bootstrap subcommand, and on a login — rather than answering with a traceback.
      - name: Check an unwritable volume is reported, not crashed on
        run: scripts/check-unwritable-volume.sh --port 8003

      - name: Container logs on failure
        if: failure()
        run: docker logs keating-ci
