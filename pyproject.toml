[project]
name = "keating"
version = "0.1.0"
description = ""
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "argon2-cffi>=25.1.0",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "markdown>=3.10.3",
    "nh3>=0.3.6",
    "ollama>=0.6.2",
    "python-dotenv>=1.2.3",
    "python-multipart>=0.0.32",
    "trafilatura>=2.2.0",
    "uvicorn[standard]>=0.52.4",
]

[dependency-groups]
dev = [
    "axe-playwright-python>=0.1.8",
    "playwright>=1.62.0",
    "pytest>=9.1.1",
    "ruff>=0.16.4",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "rubric: drives a real model and spends tokens; opt in with KEATING_RUBRIC_EVAL=1",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "S", "C4", "SIM"]
# S is flake8-bandit: security linting lives in the same pass as everything else rather
# than in a separate Bandit run.
ignore = [
    # Most over-length lines are inside embedded HTML, CSS and prompt strings, where a
    # wrap would change the generated output rather than just the source. `line-length`
    # above still governs `ruff format`; re-enable this once the tree is formatted.
    "E501",
]

[tool.ruff.lint.per-file-ignores]
# assert is how pytest asserts; subprocess is how the a11y suite starts the real server,
# and it does so with a fixed argv built from sys.executable, never from user input. S105 is
# the hardcoded-password check: the auth suites need a literal password to sign a fixture
# account in with, and a password that exists only inside the test suite is not a credential.
"tests/**" = ["S101", "S105", "S603"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency markers belong in the signature: calling them at import time is
# the framework's contract, not a mutable-default bug.
extend-immutable-calls = ["fastapi.Body", "fastapi.Depends", "fastapi.File", "fastapi.Form", "fastapi.Header", "fastapi.Path", "fastapi.Query"]
